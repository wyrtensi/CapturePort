name: PC Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint & Test Rust & Svelte
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pc/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            pc/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('pc/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: pc
        run: npm ci

      - name: Check Svelte types & code format
        working-directory: pc
        run: npm run check

      - name: Lint Rust (Clippy)
        working-directory: pc/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: pc/src-tauri
        run: cargo test --all-features

  prepare-release:
    name: Prepare Draft Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Ensure draft release exists for tags
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "release_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_id="$(gh api "repos/${REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id" | head -n 1)"

          if [[ -z "${release_id}" ]]; then
            release_id="$(gh api "repos/${REPOSITORY}/releases" \
              --method POST \
              -f tag_name="${TAG_NAME}" \
              -f name="CapturePort ${TAG_NAME}" \
              -f body="CapturePort Desktop client for Windows, macOS, and Linux." \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')"
          fi

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build & Package Tauri App
    needs:
      - validate
      - prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pc/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            pc/src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('pc/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: pc
        run: npm ci

      - name: Build Tauri App
        if: needs.prepare-release.outputs.release-id == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: pc
          args: ${{ matrix.args }}

      - name: Build and Package Tauri App
        if: needs.prepare-release.outputs.release-id != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          projectPath: pc
          tagName: v__VERSION__
          releaseName: 'CapturePort v__VERSION__'
          releaseBody: 'CapturePort Desktop client for Windows, macOS, and Linux.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
