name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Linting
        working-directory: android
        run: ./gradlew lint

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

  build-android:
    name: Build & Package APK
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name APK outputs
        working-directory: android
        shell: bash
        run: |
          version_name="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p app/build/outputs/apk/named
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/named/CapturePort-${version_name}-android-debug.apk"

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: captureport-android-debug-apk
          path: android/app/build/outputs/apk/named/*-android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Installable APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: android/app/build/outputs/apk/named/*-android-debug.apk
          draft: true
          prerelease: false
