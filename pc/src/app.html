<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CapturePort</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #08090c;
        color: #E3E3E6;
        color-scheme: dark;
      }

      .logo-mark {
        width: 36px;
        height: 36px;
      }

      #captureport-startup-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(59, 91, 255, 0.12), transparent 34%),
          #08090c;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .captureport-ready #captureport-startup-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-loader-stack {
        display: grid;
        gap: 16px;
        place-items: center;
      }

      .startup-loader-ring {
        width: 62px;
        height: 62px;
        border-radius: 999px;
        border: 2px solid rgba(164, 180, 255, 0.16);
        border-top-color: #5c77ff;
        border-right-color: rgba(92, 119, 255, 0.7);
        animation: captureport-loader-spin 0.9s linear infinite;
        box-shadow: 0 0 28px rgba(59, 91, 255, 0.18);
      }

      .startup-loader-text {
        font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #a4b4ff;
        letter-spacing: 0.04em;
      }

      @keyframes captureport-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="captureport-startup-loader" role="status" aria-live="polite">
      <div class="startup-loader-stack">
        <div class="startup-loader-ring" aria-hidden="true"></div>
        <div class="startup-loader-text">Starting CapturePort...</div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
