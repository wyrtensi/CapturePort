[package]
name = "captureport"
version = "0.3.1"
description = "CapturePort PC Tray App & MCP Server"
authors = ["wyrtensi"]
edition = "2021"

[lib]
name = "captureport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
mdns-sd = "0.20"
if-addrs = "0.15"

# Security & Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
keyring = "3"

# Data/Encoding
ulid = "1"
base64 = "0.22"
qrcodegen = "1.8"
ring = "0.17"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Clipboard & Utilities
arboard = "3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper"] }
